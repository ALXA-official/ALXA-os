name: Build Magnesium OS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libelf-dev \
            libssl-dev libcrypt-dev cpio curl xz-utils e2fsprogs qemu-system-x86

      - name: Build kernel + initramfs + disk
        run: |
          chmod +x build.sh run-qemu.sh tests/vm-test.sh
          ./build.sh

      - name: Boot test (Basic Display firmware framebuffer mode - no GPU driver)
        run: |
          timeout 40 qemu-system-x86_64 -kernel bzImage -initrd initramfs.gz \
            -append "vga=792 nomodeset console=ttyS0 console=tty0" \
            -vga std -display none -serial file:boot-basic.log -m 256M \
            -drive file=disk.img,if=virtio,format=raw || true
          cat boot-basic.log
          grep -q "Magnesium OS" boot-basic.log

      - name: Boot test (Native VirtIO-GPU KMS driver mode)
        run: |
          timeout 40 qemu-system-x86_64 -kernel bzImage -initrd initramfs.gz \
            -append "console=ttyS0 console=tty0" \
            -vga none -device virtio-gpu-pci,xres=1280,yres=800 \
            -display none -serial file:boot-gpu.log -m 256M \
            -drive file=disk.img,if=virtio,format=raw || true
          cat boot-gpu.log
          grep -q "Magnesium OS" boot-gpu.log

      - name: Full system test (accounts, permissions, saving to disk)
        continue-on-error: true
        run: ./tests/vm-test.sh

      - name: Show test logs
        if: always()
        run: |
          for f in boot-basic.log boot-gpu.log boot1.log boot2.log; do
            [ -f "$f" ] && { echo "===== $f ====="; tail -n 60 "$f"; }
          done
          true

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnesium-os
          path: |
            bzImage
            initramfs.gz
            disk.img
            kernel.config
            boot-basic.log
            boot-gpu.log
            boot1.log
            boot2.log
          if-no-files-found: warn
